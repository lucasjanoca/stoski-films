name: Deploy Stoski Films to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" --jq '.artifacts[] | select(.expired == false) | .id' | grep -Eq '^[0-9]+        id: deployment
        uses: actions/deploy-pages@v4
; then
              echo "Pages artifact is available."
              exit 0
            fi
            echo "Waiting for Pages artifact metadata ($attempt/12)"
            sleep 5
          done
          echo "::error::Pages artifact metadata did not become available."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
